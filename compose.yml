services:
  canvas:
    build: .
    image: vangogh-canvas:local
    container_name: vangogh-canvas
    restart: unless-stopped
    # CANVAS_NETWORK=host, in .env or as a variable of the stack, puts Canvas
    # on the host's network, which waking Batocera needs. Canvas then
    # listens on the host at port 1854, and ports and CANVAS_PORT no longer
    # apply.
    network_mode: ${CANVAS_NETWORK:-bridge}
    ports:
      - "${CANVAS_PORT:-1854}:1854"
    environment:
      VANGOGH_URL: ${VANGOGH_URL:?set VANGOGH_URL}
      VANGOGH_USERNAME: ${VANGOGH_USERNAME:?set VANGOGH_USERNAME}
      VANGOGH_PASSWORD: ${VANGOGH_PASSWORD:?set VANGOGH_PASSWORD}
      REBUILD_AT: ${REBUILD_AT:-04:30}
      TZ: ${TZ:-UTC}
      CUSTOM_LOGO: ${CUSTOM_LOGO:-}
      SHUTDOWN_TIMEOUT: ${SHUTDOWN_TIMEOUT:-5}
      SETTINGS_PIN: ${SETTINGS_PIN:-}
    volumes:
      - canvas-cache:/cache
      - canvas-settings:/settings
      # A folder on the host when LOGO_DIR names one, otherwise an empty named volume.
      - ${LOGO_DIR:-canvas-logo}:/logo:ro
    read_only: true
    tmpfs:
      - /tmp
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]

volumes:
  canvas-cache:
  canvas-settings:
  canvas-logo:
